{% extends 'app/base.html' %}

{% block contenido %}

<style>
    .form-container {
        max-width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    .form-container h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .form-container button {
        display: block;
        margin: 20px auto 0;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .form-container p {
        margin-bottom: 15px;
    }

    .form-container input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
    }
</style>

<div class="form-container">

    <h2>Registro</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Registrarse</button>
    </form>

</div>

{% endblock %}
