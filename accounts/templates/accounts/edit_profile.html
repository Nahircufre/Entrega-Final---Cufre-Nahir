{% extends 'app/base.html' %}

{% block contenido %}

<h2>Editar Perfil</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <h3>Datos del usuario</h3>
    {{ user_form.as_p }}

    <hr>

    <h3>Perfil</h3>
    {{ profile_form.as_p }}

    <br>

    <button type="submit">Guardar cambios</button>
</form>

{% endblock %}
