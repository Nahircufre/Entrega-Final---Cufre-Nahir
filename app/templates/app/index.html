{% extends 'app/base.html' %}

{% block contenido %}

<style>
    .inicio-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin-top: 80px;
    }

    h1 {
        font-size: 42px;
        color: white; /* 🔥 CAMBIADO A BLANCO */
        margin-bottom: 10px;
    }

    h2 {
        font-size: 28px;
        color: #555;
        margin-bottom: 20px;
    }

    form {
        background: #f8f8f8;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
        font-weight: bold;
    }

    ul {
        margin-top: 20px;
        padding: 0;
        list-style: none;
    }

    li {
        background: white;
        padding: 10px;
        margin: 5px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
</style>

<div class="inicio-container">

    <h1>Bienvenido 👋</h1>

    <h2>Inicio</h2>

    <form method="get">
        <label>Buscar producto:</label> <!-- 🔥 AGREGADO -->
        {{ form.as_p }}
        <button type="submit">Buscar</button>
    </form>

    <ul>
        {% for producto in resultados %}
            <li>{{ producto.nombre }} - ${{ producto.precio }}</li>
        {% empty %}
            <li>No hay resultados</li>
        {% endfor %}
    </ul>

</div>

{% endblock %}
