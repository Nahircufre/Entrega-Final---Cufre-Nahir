{% extends 'app/base.html' %}

{% block contenido %}

<h2>Páginas</h2>

<a href="/pages/create/">➕ Crear página</a>

<hr>

{% if pages %}

    {% for page in pages %}

        <h3>{{ page.titulo }}</h3>
        <p>{{ page.subtitulo }}</p>

        <a href="/pages/{{ page.id }}/">Leer más</a>

        <hr>

    {% endfor %}

{% else %}

    <p>No hay páginas aún.</p>

{% endif %}

{% endblock %}
