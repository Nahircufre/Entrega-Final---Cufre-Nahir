<div style="display:flex; justify-content:center; align-items:center; height:70vh;">
    <div style="text-align:center; border:1px solid #ddd; padding:30px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); max-width:400px;">

        <h2>🗑️ Confirmar eliminación</h2>

        <p style="margin:15px 0;">
            ¿Estás seguro de que querés eliminar esta página?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit"
                style="background-color:#e74c3c; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">
                Sí, eliminar
            </button>

            <a href="{% url 'pages' %}"
               style="margin-left:10px; text-decoration:none; color:#555;">
                Cancelar
            </a>
        </form>

    </div>
</div>
